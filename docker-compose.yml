services:
  mcp-server:
    build: .
    container_name: mcp-server-main
    ports:
      - "8000:8000"
    environment:
      - POWERTOOLS_SERVICE_NAME=mcp-lambda-server
      - POWERTOOLS_LOG_LEVEL=INFO
    volumes:
      - ./service:/app/service
    restart: unless-stopped

  test:
    build: .
    container_name: mcp-server-test
    volumes:
      - .:/app
    environment:
      - GOOGLE_API_KEY=test-key
    command: python -m pytest tests/ -v

  lint-check:
    build: .
    container_name: mcp-server-lint
    volumes:
      - .:/app
    command: ruff check .