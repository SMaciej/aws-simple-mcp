services:
  mcp-server:
    build: .
    container_name: mcp-server-main
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=INFO
    volumes:
      - ./service:/app/service
    restart: unless-stopped

  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      - HOST=0.0.0.0
      - MCP_AUTO_OPEN_ENABLED=false
    depends_on:
      - mcp-server

  test:
    build: .
    container_name: mcp-server-test
    profiles: ["tools"]
    volumes:
      - .:/app
    command: python -m pytest tests/ -v

  lint-check:
    build: .
    container_name: mcp-server-lint
    profiles: ["tools"]
    volumes:
      - .:/app
    command: ruff check .